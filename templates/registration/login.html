{% extends "base.html" %}
{% block titre %}Connexion{% endblock %}

{% block layout %}
<div class="flex min-h-full items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-600 text-2xl text-white">
        <i class="fa-solid fa-truck" aria-hidden="true"></i>
      </span>
      <h1 class="mt-4 text-2xl font-bold text-slate-900">DEN Source ERP</h1>
      <p class="mt-1 text-sm text-slate-600">Connectez-vous pour accéder à votre espace.</p>
    </div>

    <form method="post" class="space-y-5 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      {% if form.non_field_errors %}
        <div role="alert" class="rounded-lg border border-red-300 bg-red-50 px-4 py-3 text-sm text-red-900">
          {% for erreur in form.non_field_errors %}<p>{{ erreur }}</p>{% endfor %}
        </div>
      {% endif %}

      <div>
        <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-slate-800">Identifiant</label>
        <input type="text" name="username" id="{{ form.username.id_for_label }}" required autofocus
               autocomplete="username" value="{{ form.username.value|default:'' }}"
               class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/30">
      </div>
      <div>
        <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-slate-800">Mot de passe</label>
        <input type="password" name="password" id="{{ form.password.id_for_label }}" required
               autocomplete="current-password"
               class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/30">
      </div>
      <button type="submit"
              class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600 focus-visible:ring-offset-2">
        Se connecter
      </button>
    </form>
  </div>
</div>
{% endblock %}
