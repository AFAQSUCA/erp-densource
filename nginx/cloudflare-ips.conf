# Vraie adresse du visiteur derrière Cloudflare (audit TECH-71, cahier-des-charges.md:295 « CDN Cloudflare »).
#
# Derrière Cloudflare, chaque requête arrive depuis un serveur de Cloudflare : sans ce fichier, Nginx et Django
# verraient la même poignée d'adresses pour tous les visiteurs. Le journal d'audit perdrait l'adresse réelle, et les
# limites anti force brute (Nginx `limit_req`, apps/accounts/throttle.py) bloqueraient tout le monde à la fois.
#
# Cloudflare transmet l'adresse du visiteur dans l'en-tête CF-Connecting-IP. Nginx ne le croit QUE si la requête
# vient d'une des plages ci-dessous (celles de Cloudflare) : un visiteur qui contacte le serveur directement et
# écrit lui-même cet en-tête n'est pas cru. Le fichier est donc sans danger, que le site soit derrière Cloudflare
# ou non. Nginx remplace alors $remote_addr par la vraie adresse, qu'il transmet à Django (X-Forwarded-For).
#
# Liste officielle : https://www.cloudflare.com/ips/ (relevée le 13/10/2026). Elle change rarement ; pour la
# rafraîchir : sh nginx/maj-ips-cloudflare.sh, puis docker compose up -d --build nginx (GUIDE-DEPLOIEMENT.md § 8 bis).

