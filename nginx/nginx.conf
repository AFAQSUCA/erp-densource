# Reverse proxy devant Gunicorn (étape 7 lot 3) — cahier-des-charges.md:249, architecture.md §6.
#
# Sert directement /static/ et /media/ (fichiers déjà sur disque, volumes partagés avec le
# conteneur `web`) : Gunicorn ne voit que les requêtes applicatives, comme prévu par la vue
# déploiement (Nginx -> Gunicorn workers).
#
# TLS : ce fichier écoute en HTTP (port 80) et transmet `X-Forwarded-Proto` tel quel — Django
# (SECURE_PROXY_SSL_HEADER, config/settings/prod.py) redirige alors vers HTTPS puisqu'aucun TLS
# n'est encore terminé ici. Pour une vraie mise en production, voir GUIDE-DEPLOIEMENT.md
# « Activer HTTPS » : il ajoute un bloc `server` 443 avec les certificats (Let's Encrypt / certbot)
# et une redirection HTTP -> HTTPS à ce niveau plutôt que dans Django.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;  # ne pas annoncer la version de Nginx

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10m;

    upstream django {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        # Défi HTTP-01 de Let's Encrypt (certbot, mode webroot) — voir GUIDE-DEPLOIEMENT.md
        # « Activer HTTPS ». Le dossier est vide et sans effet tant que certbot n'est pas lancé.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            access_log off;
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
            access_log off;
        }

        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # TRUSTED_PROXY_COUNT=1 (.env) : Django ne lit que la dernière adresse de cette liste
            # (apps/core/middleware.get_client_ip), jamais une valeur écrite par le client lui-même.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}
