# Reverse proxy devant Gunicorn (étape 7 lot 3) — cahier-des-charges.md:249, architecture.md §6.
#
# Sert directement /static/ (fichiers déjà sur disque, volumes partagés avec le conteneur `web`) :
# Gunicorn ne voit que les requêtes applicatives, comme prévu par la vue déploiement (Nginx -> Gunicorn
# workers). Les fichiers téléversés (/medias/) passent par Django, qui contrôle le rôle (X-Accel-Redirect).
#
# MODÈLE : ce fichier n'est pas lu tel quel. Au démarrage, nginx/preparer-https.sh en tire
# /etc/nginx/nginx.conf en remplaçant ${DOMAINE} (variable du service nginx, docker-compose.yml, lue dans
# .env) et choisit le certificat TLS (include certificat-tls.conf) : le vrai certificat Let's Encrypt monté
# depuis ./certs s'il existe, sinon un certificat auto-signé provisoire. Nginx démarre donc même sur un serveur
# neuf, et peut servir le défi HTTP-01 qui permet justement d'obtenir le vrai certificat (GUIDE-DEPLOIEMENT.md
# « Activer HTTPS »). Le port 80 ne sert que ce défi (et le renouvellement) et redirige le reste vers HTTPS.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;  # ne pas annoncer la version de Nginx

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10m;

    upstream django {
        server web:8000;
    }

    # Mise à niveau HTTP -> WebSocket (suivi des missions en direct) : « upgrade » seulement si le client
    # la demande, sinon la connexion se ferme normalement.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        server_name ${DOMAINE} www.${DOMAINE};

        # Défi HTTP-01 de Let's Encrypt (certbot, mode webroot) — voir GUIDE-DEPLOIEMENT.md
        # « Activer HTTPS », renouvellement mensuel. Le dossier est vide et sans effet le reste du
        # temps.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name ${DOMAINE} www.${DOMAINE};

        include /etc/nginx/certificat-tls.conf;  # généré par preparer-https.sh (vrai certificat, sinon provisoire)

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            access_log off;
        }

        # Fichiers téléversés (justificatifs, devis) : jamais en libre accès. Django contrôle le rôle sur
        # /medias/... puis répond X-Accel-Redirect vers cet emplacement, inaccessible directement.
        location /medias-internes/ {
            internal;
            alias /app/media/;
            add_header X-Content-Type-Options nosniff always;
        }

        # WebSocket du suivi des missions en direct : conteneur `realtime` (Daphne). Adresse résolue à
        # chaque connexion par le résolveur de Docker : Nginx démarre même si ce conteneur est absent ou
        # en train de redémarrer (sans cela, « host not found in upstream » l'empêcherait de démarrer).
        # Les pings de Daphne (toutes les 20 s) maintiennent la connexion ouverte malgré le délai de lecture.
        location /ws/ {
            resolver 127.0.0.11 valid=10s;
            set $realtime realtime:8001;
            proxy_pass http://$realtime;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # TRUSTED_PROXY_COUNT=1 (.env) : Django ne lit que la dernière adresse de cette liste
            # (apps/core/middleware.get_client_ip), jamais une valeur écrite par le client lui-même.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}
